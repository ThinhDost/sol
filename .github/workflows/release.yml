name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            daemon_out: sol-windows-amd64.exe
            cli_out: sol-windows-amd64-cli.exe
          - os: linux
            arch: amd64
            daemon_out: sol-linux-amd64
            cli_out: sol-linux-amd64-cli
          - os: darwin
            arch: arm64
            daemon_out: sol-darwin-arm64
            cli_out: sol-darwin-arm64-cli
          - os: darwin
            arch: amd64
            daemon_out: sol-darwin-amd64
            cli_out: sol-darwin-amd64-cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build binaries
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags="-s -w" -o dist/${{ matrix.daemon_out }} ./cmd/sol-daemon
          go build -ldflags="-s -w" -o dist/${{ matrix.cli_out }} ./cmd/sol-cli

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  publish:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
